<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}</style>
<rect width="1200" height="720" fill="#f5f7fb"/>
<text x="42" y="43" font-size="13" font-weight="600" fill="#60738a" text-anchor="start">01 / STRUCTURE</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#20334a" text-anchor="start">System architecture</text>
<text x="42" y="119" font-size="16" font-weight="400" fill="#60738a" text-anchor="start">An asynchronous document-indexing service: components, boundaries, and dependencies.</text>
<rect x="26" y="145" width="1148" height="514" rx="20" fill="white" stroke="#dde5ee"/>
<rect x="325" y="179" width="805" height="431" rx="18" fill="#f7f9fd" stroke="#c9d5e3" stroke-dasharray="6 6"/><text x="349" y="206" font-size="13" font-weight="600" fill="#60738a" text-anchor="start">INDEXING BACKEND</text><path d="M68 280 l10 -10 h170 l-10 10 Z" fill="#8fc4ed" fill-opacity=".2" stroke="#8fc4ed"/><path d="M238 280 l10 -10 v90 l-10 10 Z" fill="#8fc4ed" fill-opacity=".3" stroke="#8fc4ed"/><rect x="68" y="280" width="170" height="90" fill="#8fc4ed" fill-opacity=".25" stroke="#8fc4ed"/><text x="153.0" y="325.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Client</text><text x="153.0" y="350.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">uploads a document</text><path d="M365 280 l10 -10 h180 l-10 10 Z" fill="#8fc4ed" fill-opacity=".2" stroke="#8fc4ed"/><path d="M545 280 l10 -10 v90 l-10 10 Z" fill="#8fc4ed" fill-opacity=".3" stroke="#8fc4ed"/><rect x="365" y="280" width="180" height="90" fill="#8fc4ed" fill-opacity=".25" stroke="#8fc4ed"/><text x="455.0" y="325.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">API</text><text x="455.0" y="350.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">accepts the request</text><path d="M640 280 l10 -10 h180 l-10 10 Z" fill="#e8bd73" fill-opacity=".2" stroke="#e8bd73"/><path d="M820 280 l10 -10 v90 l-10 10 Z" fill="#e8bd73" fill-opacity=".3" stroke="#e8bd73"/><rect x="640" y="280" width="180" height="90" fill="#e8bd73" fill-opacity=".25" stroke="#e8bd73"/><text x="730.0" y="325.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Job queue</text><text x="730.0" y="350.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">buffers pending work</text><path d="M910 280 l10 -10 h180 l-10 10 Z" fill="#74c8b1" fill-opacity=".2" stroke="#74c8b1"/><path d="M1090 280 l10 -10 v90 l-10 10 Z" fill="#74c8b1" fill-opacity=".3" stroke="#74c8b1"/><rect x="910" y="280" width="180" height="90" fill="#74c8b1" fill-opacity=".25" stroke="#74c8b1"/><text x="1000.0" y="325.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Worker</text><text x="1000.0" y="350.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">builds the index</text><path d="M365 481 l10 -10 h180 l-10 10 Z" fill="#b5a4e7" fill-opacity=".2" stroke="#b5a4e7"/><path d="M545 481 l10 -10 v80 l-10 10 Z" fill="#b5a4e7" fill-opacity=".3" stroke="#b5a4e7"/><rect x="365" y="481" width="180" height="80" fill="#b5a4e7" fill-opacity=".25" stroke="#b5a4e7"/><text x="455.0" y="521.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Object store</text><text x="455.0" y="546.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">source documents</text><path d="M910 481 l10 -10 h180 l-10 10 Z" fill="#b5a4e7" fill-opacity=".2" stroke="#b5a4e7"/><path d="M1090 481 l10 -10 v80 l-10 10 Z" fill="#b5a4e7" fill-opacity=".3" stroke="#b5a4e7"/><rect x="910" y="481" width="180" height="80" fill="#b5a4e7" fill-opacity=".25" stroke="#b5a4e7"/><text x="1000.0" y="521.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Vector index</text><text x="1000.0" y="546.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">searchable chunks</text><polyline points="238,315 365,315" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="300" y="298" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">upload</text><polyline points="545,315 640,315" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="592" y="298" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">enqueue</text><polyline points="820,315 910,315" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="865" y="298" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">deliver</text><polyline points="455,370 455,471" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="487" y="428" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">store</text><polyline points="910,350 845,350 845,430 560,430 560,510 545,510" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="714" y="416" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">read source</text><polyline points="1000,370 1000,471" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1052" y="428" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">write vectors</text><text x="74" y="542" font-size="17" font-weight="600" fill="#20334a" text-anchor="start">One block,</text><text x="74" y="568" font-size="17" font-weight="600" fill="#20334a" text-anchor="start">one responsibility.</text><text x="42" y="696" font-size="14" font-weight="400" fill="#60738a" text-anchor="start">Illustrative system • arrows show directed interactions; their labels specify the operation.</text></svg>