<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}</style>
<rect width="1200" height="720" fill="#f5f7fb"/>
<text x="42" y="43" font-size="13" font-weight="600" fill="#60738a" text-anchor="start">04 / DECISIONS</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#20334a" text-anchor="start">Control flow</text>
<text x="42" y="119" font-size="16" font-weight="400" fill="#60738a" text-anchor="start">A bounded retry policy: the success path, terminal failures, and the loop are explicit.</text>
<rect x="26" y="145" width="1148" height="514" rx="20" fill="white" stroke="#dde5ee"/>
<rect x="65" y="290" width="155" height="70" rx="13" fill="#8fc4ed" fill-opacity=".23" stroke="#8fc4ed" stroke-width="1.5"/><text x="142.5" y="331.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Fetch source</text><polygon points="355,275.0 450.0,325 355,375.0 260.0,325" fill="#e8bd73" fill-opacity=".24" stroke="#e8bd73"/><text x="355" y="330" font-size="17" font-weight="600" fill="#20334a" text-anchor="middle">Succeeded?</text><rect x="520" y="290" width="170" height="70" rx="13" fill="#74c8b1" fill-opacity=".23" stroke="#74c8b1" stroke-width="1.5"/><text x="605.0" y="331.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Parse document</text><rect x="905" y="290" width="205" height="70" rx="13" fill="#74c8b1" fill-opacity=".23" stroke="#74c8b1" stroke-width="1.5"/><text x="1007.5" y="331.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Continue indexing</text><polyline points="220,325 260,325" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="450,325 520,325" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="485" y="309" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">yes</text><polyline points="690,325 905,325" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="798" y="309" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">valid content</text><polygon points="355,445.0 450.0,500 355,555.0 260.0,500" fill="#e8bd73" fill-opacity=".24" stroke="#e8bd73"/><text x="355" y="505" font-size="17" font-weight="600" fill="#20334a" text-anchor="middle">Retry allowed?</text><polyline points="355,375 355,445" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="381" y="415" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">no</text><rect x="65" y="465" width="155" height="70" rx="13" fill="#e8bd73" fill-opacity=".23" stroke="#e8bd73" stroke-width="1.5"/><text x="142.5" y="506.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Wait / backoff</text><polyline points="260,500 220,500" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="480" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">yes</text><polyline points="142,465 142,360" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="173" y="418" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">retry</text><rect x="680" y="465" width="220" height="70" rx="13" fill="#e8a0a0" fill-opacity=".23" stroke="#e8a0a0" stroke-width="1.5"/><text x="790.0" y="500.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Record failure</text><text x="790.0" y="525.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">stop this job</text><polyline points="450,500 680,500" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="561" y="482" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">no</text><polyline points="605,360 605,421 790,421 790,465" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="790" y="405" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">invalid content</text><text x="68" y="210" font-size="16" font-weight="400" fill="#60738a" text-anchor="start">Fetch attempts start at 1 and increase on each retry.</text><text x="68" y="606" font-size="17" font-weight="600" fill="#20334a" text-anchor="start">Retry allowed = transient fetch error AND attempts &lt; 3.</text><text x="42" y="696" font-size="14" font-weight="400" fill="#60738a" text-anchor="start">Illustrative policy • diamonds test conditions; every branch is labeled; retries return to the failed operation.</text></svg>