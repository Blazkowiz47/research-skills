<text x="42" y="43" font-size="13" font-weight="600" fill="#60738a" text-anchor="start">02 / TRANSFORMATIONS</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#20334a" text-anchor="start">Data flow</text>
<text x="42" y="119" font-size="16" font-weight="400" fill="#60738a" text-anchor="start">Follow the data through indexing; each arrow names what crosses the boundary.</text>
<rect x="26" y="145" width="1148" height="514" rx="20" fill="white" stroke="#dde5ee"/>
<rect x="65" y="285" width="180" height="100" rx="13" fill="#8fc4ed" fill-opacity=".23" stroke="#8fc4ed" stroke-width="1.5"/><text x="155.0" y="335.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Documents</text><text x="155.0" y="360.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">PDF / text</text><rect x="285" y="285" width="180" height="100" rx="13" fill="#74c8b1" fill-opacity=".23" stroke="#74c8b1" stroke-width="1.5"/><text x="375.0" y="335.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Parse</text><text x="375.0" y="360.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">extract readable text</text><rect x="505" y="285" width="180" height="100" rx="13" fill="#74c8b1" fill-opacity=".23" stroke="#74c8b1" stroke-width="1.5"/><text x="595.0" y="335.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Chunk</text><text x="595.0" y="360.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">split with overlap</text><rect x="725" y="285" width="180" height="100" rx="13" fill="#74c8b1" fill-opacity=".23" stroke="#74c8b1" stroke-width="1.5"/><text x="815.0" y="335.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Embed</text><text x="815.0" y="360.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">encode each chunk</text><rect x="945" y="285" width="180" height="100" rx="13" fill="#b5a4e7" fill-opacity=".23" stroke="#b5a4e7" stroke-width="1.5"/><text x="1035.0" y="335.0" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Vector index</text><text x="1035.0" y="360.0" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">store + retrieve</text><polyline points="245,335 285,335" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="265.0" y="270" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">bytes</text><polyline points="465,335 505,335" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="485.0" y="270" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">text</text><polyline points="685,335 725,335" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="705.0" y="270" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">chunks</text><polyline points="905,335 945,335" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="925.0" y="270" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">vectors</text><rect x="302" y="474" width="570" height="95" rx="13" fill="#e8bd73" fill-opacity=".23" stroke="#e8bd73" stroke-width="1.5"/><text x="587.0" y="521.5" font-size="19" font-weight="600" fill="#20334a" text-anchor="middle">Metadata travels with the content</text><text x="587.0" y="546.5" font-size="14" font-weight="400" fill="#60738a" text-anchor="middle">document_id → chunk_id + source span → searchable record</text><polyline points="595,385 595,474" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="872,522 1035,522 1035,385" fill="none" stroke="#20334a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1000" y="556" text-anchor="middle" font-size="15" fill="#20334a" stroke="#fff" stroke-width="6" paint-order="stroke">join on chunk_id</text><text x="70" y="207" font-size="13" font-weight="600" fill="#60738a" text-anchor="start">CONTENT PATH</text><text x="70" y="620" font-size="16" font-weight="400" fill="#60738a" text-anchor="start">Data shapes and provenance are visible; timing and deployment are intentionally abstracted.</text><text x="42" y="696" font-size="14" font-weight="400" fill="#60738a" text-anchor="start">Illustrative pipeline • solid arrows carry data; blocks name transformations or storage.</text></svg>